<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root { color-scheme: light dark; --gap: 12px; }
      body { margin: 0; padding: 16px 18px; font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; }
      h1 { font-size: 15px; margin: 0 0 var(--gap); }
      fieldset { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 6px; margin: 0 0 var(--gap); padding: 8px 10px 10px; }
      legend { padding: 0 4px; font-weight: 600; }
      label.row { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); margin: 0 0 var(--gap); }
      label.check { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      input[type='number'], select { width: 120px; padding: 3px 6px; }
      #status { min-height: 1.4em; font-size: 12px; opacity: 0.8; }
      #status.error { color: #d9534f; opacity: 1; }
    </style>
  </head>
  <body>
    <h1 id="title">Settings</h1>
    <form id="form"></form>
    <div id="status"></div>
    <script>
      // Draws whatever the game's plugin declares. Nothing here knows any game:
      // the field list, labels and ranges all come from the bridge.
      const gameId = new URLSearchParams(location.search).get('game')
      const form = document.getElementById('form')
      const status = document.getElementById('status')
      let values = {}
      let saveTimer = null

      function report(text, isError = false) {
        status.textContent = text
        status.className = isError ? 'error' : ''
      }

      function readField(field) {
        if (field.type === 'boolean') return form.querySelector(`[name="${field.key}"]`).checked
        if (field.type === 'multiselect') {
          return [...form.querySelectorAll(`[name="${field.key}"]:checked`)].map(input => input.value)
        }
        if (field.type === 'number') {
          const raw = form.querySelector(`[name="${field.key}"]`).value.trim()
          return raw === '' ? (field.optional ? null : 0) : Number(raw)
        }
        return form.querySelector(`[name="${field.key}"]`).value
      }

      function scheduleSave(schema) {
        clearTimeout(saveTimer)
        report('Saving…')
        saveTimer = setTimeout(async () => {
          const next = {}
          for (const field of schema) next[field.key] = readField(field)
          try {
            const reply = await window.bridgeTray.saveSettings(gameId, next)
            values = reply.values
            draw(reply.schema, reply.values)
            report('Saved')
          } catch (error) {
            report(String(error?.message || error), true)
          }
        }, 400)
      }

      function draw(schema, current) {
        form.replaceChildren()
        for (const field of schema) {
          if (field.type === 'multiselect') {
            const set = document.createElement('fieldset')
            const legend = document.createElement('legend')
            legend.textContent = field.label
            set.append(legend)
            const selected = new Set(Array.isArray(current[field.key]) ? current[field.key] : [])
            for (const option of field.options) {
              const label = document.createElement('label')
              label.className = 'check'
              const input = document.createElement('input')
              input.type = 'checkbox'
              input.name = field.key
              input.value = option.value
              input.checked = selected.has(option.value)
              label.append(input, document.createTextNode(option.label))
              set.append(label)
            }
            form.append(set)
            continue
          }
          const row = document.createElement('label')
          row.className = 'row'
          const text = document.createElement('span')
          text.textContent = field.label
          let input
          if (field.type === 'boolean') {
            input = document.createElement('input')
            input.type = 'checkbox'
            input.checked = current[field.key] === true
          } else if (field.type === 'number') {
            input = document.createElement('input')
            input.type = 'number'
            if (field.min !== undefined) input.min = field.min
            if (field.max !== undefined) input.max = field.max
            input.value = current[field.key] == null ? '' : String(current[field.key])
          } else {
            input = document.createElement('select')
            for (const option of field.options) {
              const element = document.createElement('option')
              element.value = option.value
              element.textContent = option.label
              element.selected = current[field.key] === option.value
              input.append(element)
            }
          }
          input.name = field.key
          row.append(text, input)
          form.append(row)
        }
      }

      async function load() {
        try {
          const reply = await window.bridgeTray.loadSettings(gameId)
          document.title = `${reply.gameName} — Settings`
          document.getElementById('title').textContent = reply.gameName
          values = reply.values
          draw(reply.schema, reply.values)
          form.addEventListener('change', () => scheduleSave(reply.schema))
          report('')
        } catch (error) {
          report(String(error?.message || error), true)
        }
      }

      load()
    </script>
  </body>
</html>
