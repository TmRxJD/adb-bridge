name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm as well'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
      # Skipped when NPM_TOKEN is not configured, and tolerant of a version
      # that is already on the registry -- publishing by hand and then tagging
      # is a normal order of operations, and it should not fail the release
      # that carries the installers.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the npm publish."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if npm view "adb-bridge@$version" version >/dev/null 2>&1; then
            echo "adb-bridge@$version is already published; nothing to do."
            exit 0
          fi
          npm publish --access public

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: choco install innosetup --no-progress -y
      - run: node installer/windows/build.mjs

      # Signing is optional so forks and unconfigured repos still build. It is
      # not cosmetic: on machines with Smart App Control enforcing, an unsigned
      # uninstaller is blocked outright, which is not something the installer
      # can work around.
      - name: Is signing configured?
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNPATH_API_TOKEN }}" ] && [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath is not configured; publishing an unsigned installer."
          fi

      - name: Upload unsigned artifact for SignPath
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/AdbBridgeSetup.exe

      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: adb-bridge
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Use the signed installer when there is one
        shell: pwsh
        run: |
          if (Test-Path dist-signed\AdbBridgeSetup.exe) {
            Copy-Item dist-signed\AdbBridgeSetup.exe dist\AdbBridgeSetup.exe -Force
            Write-Host "Signed: $((Get-AuthenticodeSignature dist\AdbBridgeSetup.exe).Status)"
          } else {
            Write-Host 'Unsigned build.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/AdbBridgeSetup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash installer/macos/build-pkg.sh
        env:
          ADB_BRIDGE_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.pkg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo gem install --no-document fpm
      - run: bash installer/linux/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.rpm

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Websites link to /releases/latest/download/<name>, which only resolves
      # if the asset has that exact name. Versioned filenames would mean every
      # release silently broke the download buttons until someone edited the
      # site, so publish stable names alongside the versioned ones.
      - name: Give the installers stable names
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/release-windows/AdbBridgeSetup.exe release/AdbBridgeSetup.exe
          cp artifacts/release-macos/*.pkg              release/AdbBridge.pkg
          cp artifacts/release-linux/*.deb              release/adb-bridge.deb
          # The .rpm only exists when rpmbuild was available on the runner.
          if compgen -G 'artifacts/release-linux/*.rpm' > /dev/null; then
            cp artifacts/release-linux/*.rpm release/adb-bridge.rpm
          fi
          ls -la release

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
