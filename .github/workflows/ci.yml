name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:syntax
      - run: npm test

  # A clean Windows runner is the sandbox for installer testing. It matters that
  # it is clean: local testing kept hitting a machine with Volta installed, whose
  # shims and package layout masked what a normal user would actually see.
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: node installer/windows/build.mjs

      - name: A download's referrer pre-selects that game
        shell: pwsh
        run: |
          # Windows records the linking page in the Mark-of-the-Web stream.
          # Installing with no /TASKS means whatever the wizard pre-ticked is
          # what actually runs, so the enable steps in the log are the proof.
          $cases = @(
            @{ name = 'tracker'; referrer = 'https://the-tower-run-tracker.com/import';   expect = 'thetower' }
            @{ name = 'cifi';    referrer = 'https://tmrxjd.github.io/cifi-tools/';       expect = 'cifi' }
            @{ name = 'repo';    referrer = 'https://github.com/TmRxJD/adb-bridge/releases'; expect = '' }
          )
          $failed = @()
          foreach ($case in $cases) {
            $exe = Join-Path $env:TEMP "setup-$($case.name).exe"
            Copy-Item dist\AdbBridgeSetup.exe $exe -Force
            $zone = "[ZoneTransfer]`r`nZoneId=3`r`nReferrerUrl=$($case.referrer)`r`nHostUrl=https://objects.githubusercontent.com/asset`r`n"
            Set-Content -LiteralPath $exe -Stream Zone.Identifier -Value $zone

            $log = Join-Path $env:TEMP "setup-$($case.name).log"
            # -NoNewWindow IS LOAD-BEARING, and without it this step has never once passed.
            #
            # Start-Process defaults to ShellExecute, and ShellExecute is what runs the SmartScreen
            # trust check. We have just deliberately stamped ZoneId=3 on this exe -- that is the
            # whole point of the test -- so the shell treats an unsigned installer as downloaded
            # from the internet and refuses to launch it. With no desktop to click "Run anyway" on,
            # the refusal surfaces as Start-Process failing with "The operation was canceled by the
            # user", which reads like a flake and is not one.
            #
            # -NoNewWindow makes PowerShell use CreateProcess instead, which skips the shell trust
            # check while LEAVING THE STREAM IN PLACE -- and the stream is what is under test, since
            # the installer reads ReferrerUrl out of it itself. Safe here only because the installer
            # is PrivilegesRequired=lowest: CreateProcess cannot elevate, so a manifest asking for
            # admin would fail instead.
            $p = Start-Process $exe -PassThru -NoNewWindow -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log"
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "install hung for $($case.name)" }

            $enabled = @()
            if (Test-Path $log) {
              $enabled = Select-String -Path $log -Pattern 'games add (\w+)' -AllMatches |
                ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
            }
            $got = ($enabled | Sort-Object -Unique) -join ','
            Write-Host "$($case.name): referrer=$($case.referrer) -> '$got'"
            if ($got -ne $case.expect) { $failed += "$($case.name): expected '$($case.expect)', got '$got'" }

            $u = Join-Path $env:LOCALAPPDATA 'AdbBridge\unins000.exe'
            if (Test-Path $u) {
              $q = Start-Process $u -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
              $null = $q.WaitForExit(120000)
            }
            $cfg = Join-Path $env:USERPROFILE '.adb-bridge'
            if (Test-Path $cfg) { Remove-Item -LiteralPath $cfg -Recurse -Force }
          }
          if ($failed) { $failed | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'pre-selection verified'
          exit 0

      - name: Install silently, with both games and autostart
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'setup.log'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process dist\AdbBridgeSetup.exe -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART', `
            '/TASKS=game_thetower,game_cifi,startup', "/LOG=$log"
          # A silent install that needs a click is a bug, not a slow install:
          # a MsgBox from [Code] is not covered by /SUPPRESSMSGBOXES and will
          # sit here forever. Fail rather than hang the job.
          if (-not $p.WaitForExit(300000)) {
            $p.Kill()
            Get-Content $log -Tail 40
            throw 'Installer did not finish in 5 minutes - it is probably waiting on a dialog.'
          }
          Write-Host "exit=$($p.ExitCode) in $([int]$sw.Elapsed.TotalSeconds)s"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Installer exited $($p.ExitCode)" }
          Get-Content $log | Select-String 'Process exit code'

      - name: Check what the install actually did
        shell: pwsh
        run: |
          $fail = @()

          $cfg = "$env:USERPROFILE\.adb-bridge\bridge.json"
          if (Test-Path $cfg) {
            $games = (Get-Content $cfg -Raw | ConvertFrom-Json).games
            Write-Host "enabled games: $($games -join ', ')"
            if ($games -notcontains 'thetower') { $fail += 'thetower was not enabled' }
            if ($games -notcontains 'cifi')     { $fail += 'cifi was not enabled' }
          } else {
            $fail += 'bridge.json was never written - no games were enabled'
          }

          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'ADB Bridge.cmd'
          schtasks /Query /TN AdbBridge 2>$null | Out-Null
          $hasTask = ($LASTEXITCODE -eq 0)
          if (-not (Test-Path $startup) -and -not $hasTask) {
            $fail += 'no autostart entry was created'
          }

          # The behaviour that got the per-game bridge flagged as
          # Trojan:Script/Wacatac.C!ml. It must never come back.
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if (@($run.PSObject.Properties.Name) -match 'Adb|Bridge') { $fail += 'a Run-key was written' }

          if ($fail) { $fail | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'install verified'
          exit 0

      - name: Serve, and check the ports answer
        shell: pwsh
        run: |
          # Run what the installer put on this machine, not the checkout: the
          # checkout has no node_modules in this job, and the installed copy is
          # the artifact under test.
          # npm installs both a POSIX shell script and a .cmd shim; Get-Command
          # finds the extensionless one first, and Start-Process on that fails
          # with "%1 is not a valid Win32 application". Go through cmd.
          if (-not (Get-Command adb-bridge -ErrorAction SilentlyContinue)) {
            throw 'adb-bridge was not installed globally by the installer'
          }
          $p = Start-Process cmd -PassThru -NoNewWindow `
            -ArgumentList '/c','adb-bridge','--no-boot','--daemon' -RedirectStandardOutput serve.log
          Start-Sleep 10
          Get-Content serve.log -ErrorAction SilentlyContinue
          $bad = @()
          foreach ($port in 43781, 43791) {
            $ok = (Test-NetConnection 127.0.0.1 -Port $port -WarningAction SilentlyContinue).TcpTestSucceeded
            Write-Host "port ${port}: $(if ($ok) {'listening'} else {'CLOSED'})"
            if (-not $ok) { $bad += $port }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($bad) { throw "ports not served: $($bad -join ', ')" }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\AdbBridge\unins000.exe"
          $p = Start-Process $u -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Uninstaller hung' }
          Start-Sleep 3
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'ADB Bridge.cmd'
          if (Test-Path $startup) { throw 'autostart entry survived uninstall' }
          schtasks /Query /TN AdbBridge 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'scheduled task survived uninstall' }
          Write-Host 'uninstall verified'
          # schtasks exits 1 when the task is absent, which is the result we
          # want here -- but pwsh would hand that 1 back as the step's status.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: dist/AdbBridgeSetup.exe

  installer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build pkg
        run: bash installer/macos/build-pkg.sh

      - name: Install it
        run: |
          set -euo pipefail
          pkg=$(ls dist/AdbBridge-*.pkg)
          # -target / applies the default choices: core + The Tower, not CIFI.
          sudo installer -pkg "$pkg" -target / -verbose

      - name: Check what the install actually did
        run: |
          set -euo pipefail
          cfg="$HOME/.adb-bridge/bridge.json"
          if [ ! -f "$cfg" ]; then
            echo "bridge.json was never written - no games were enabled" >&2
            exit 1
          fi
          cat "$cfg"
          node -e '
            const games = require(process.env.HOME + "/.adb-bridge/bridge.json").games
            if (!games.includes("thetower")) { console.error("thetower not enabled"); process.exit(1) }
            // CIFI is unselected by default, so it must NOT have been enabled.
            if (games.includes("cifi")) { console.error("cifi enabled but was not selected"); process.exit(1) }
            console.log("install verified:", games.join(", "))
          '

      - name: Serve, and check the port answers
        run: |
          set -euo pipefail
          adb-bridge --no-boot --daemon > serve.log 2>&1 &
          sleep 10
          cat serve.log || true
          nc -z 127.0.0.1 43781 || { echo "port 43781 not served" >&2; exit 1; }
          echo "port 43781 listening"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer
          path: dist/*.pkg

  installer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build packages
        run: bash installer/linux/build-packages.sh

      - name: Install the .deb
        run: sudo apt-get install -y ./dist/adb-bridge_*_all.deb

      - name: Check what the install actually did
        run: |
          set -euo pipefail
          command -v adb-bridge-launch >/dev/null || { echo "launcher not on PATH" >&2; exit 1; }
          cfg="$HOME/.adb-bridge/bridge.json"
          [ -f "$cfg" ] || { echo "no game was enabled" >&2; exit 1; }
          cat "$cfg"
          grep -q thetower "$cfg" || { echo "thetower not enabled" >&2; exit 1; }
          echo "install verified"

      - name: Serve, and check the port answers
        run: |
          set -euo pipefail
          # Use the launcher the package installs to /usr/bin, not a global
          # shim: the npm install ran as root, so its bin directory is not on
          # this user's PATH -- and the launcher is the artifact under test.
          adb-bridge-launch --no-boot --daemon > serve.log 2>&1 &
          sleep 12
          cat serve.log || true
          nc -z 127.0.0.1 43781 || { echo "port 43781 not served" >&2; exit 1; }
          echo "port 43781 listening"

      - name: Remove it cleanly
        run: sudo apt-get remove -y adb-bridge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: dist/*.deb
